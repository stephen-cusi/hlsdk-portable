name: Sync upstream
on:
  schedule:
    - cron: '0 6 * * *'  # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch:       # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch upstream
      run: |
        git remote add upstream https://github.com/FWGS/hlsdk-portable.git
        git fetch upstream master

    - name: Check for new commits
      id: check
      run: |
        # Only sync when the fork is actually behind. Being ahead (fork-only
        # WoA/CI commits) must not trigger a sync - merging would be a no-op
        # and the workflows-restore guard below would misfire on HEAD^1.
        BEHIND=$(git rev-list --count HEAD..upstream/master)
        echo "Behind by $BEHIND commits."
        if [ "$BEHIND" = "0" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "Already up to date."
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Merge upstream
      if: steps.check.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Pre-merge fork commit; the reference for restoring our workflows.
        PREV=$(git rev-parse HEAD)

        # Prefer upstream on ordinary content conflicts. This still leaves
        # delete/modify and other unresolved conflicts behind.
        if ! git merge upstream/master --no-edit -X theirs \
             -m "chore: sync with upstream FWGS/hlsdk-portable"; then
          echo "Merge left conflicts; resolving in favour of upstream:"
          # Keep the fork's WoA (MSVC ARM64 NEON) work; the only recurring
          # conflict sites are the NEON math files upstream keeps rewriting.
          # Upstream's rewrites no longer use brace initialisation, so they
          # are MSVC-compatible again - taking upstream preserves the build.
          git diff --name-only --diff-filter=U
          git diff -z --name-only --diff-filter=U \
            | xargs -0 -r git checkout --theirs --
          git add -A
          git commit --no-edit
        fi

        # Never push upstream edits to .github/workflows: pushes made with
        # the Actions token may not modify workflow files, and the fork's CI
        # matrix (windows-11-arm) is maintained here, not upstream.
        # Compare against the pre-merge snapshot instead of HEAD^1, so a
        # no-op merge ("Already up to date", no commit created) is a no-op
        # here too instead of amending an unrelated commit away.
        if git diff --quiet "$PREV" HEAD -- .github/workflows; then :; else
          git restore --source "$PREV" --staged --worktree -- .github/workflows
          git commit --amend --no-edit
        fi

        git push origin master
