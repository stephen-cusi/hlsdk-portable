name: Sync upstream
on:
  schedule:
    - cron: '0 6 * * *'  # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch:       # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch upstream
      run: |
        git remote add upstream https://github.com/FWGS/hlsdk-portable.git
        git fetch upstream master

    - name: Check for new commits
      id: check
      run: |
        LOCAL=$(git rev-parse HEAD)
        UPSTREAM=$(git rev-parse upstream/master)
        if [ "$LOCAL" = "$UPSTREAM" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "Already up to date."
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "Behind by $BEHIND commits."
        fi

    - name: Merge upstream
      if: steps.check.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Prefer upstream on ordinary content conflicts. This still leaves
        # delete/modify and other unresolved conflicts behind.
        if ! git merge upstream/master --no-edit -X theirs \
             -m "chore: sync with upstream FWGS/hlsdk-portable"; then
          echo "Merge left conflicts; resolving in favour of upstream:"
          # Keep the fork's WoA (MSVC ARM64 NEON) work; the only recurring
          # conflict sites are the NEON math files upstream keeps rewriting.
          # Upstream's rewrites no longer use brace initialisation, so they
          # are MSVC-compatible again - taking upstream preserves the build.
          git diff --name-only --diff-filter=U
          git diff -z --name-only --diff-filter=U \
            | xargs -0 -r git checkout --theirs --
          git add -A
          git commit --no-edit
        fi

        # Never push upstream edits to .github/workflows: pushes made with
        # the Actions token may not modify workflow files, and the fork's CI
        # matrix (windows-11-arm) is maintained here, not upstream.
        # HEAD^1 is the pre-merge fork commit, which carries our own CI.
        if git diff --quiet HEAD^1 HEAD -- .github/workflows; then :; else
          git restore --source HEAD^1 --staged --worktree -- .github/workflows
          git commit --amend --no-edit
        fi

        git push origin master
